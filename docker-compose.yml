services:
  hetzner-web:
    build: .
    container_name: hetzner-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      HETZNER_WEB_DISABLE_WORKERS: "false"
      REPORT_STATE_PATH: /app/state/report_state.json
      REPORT_STATE_BACKUP_DIR: /app/state/report_state_backups
      THRESHOLD_STATE_PATH: /app/state/threshold_state.json
    ports:
      - "1227:1227"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./state:/app/state
      - ./web_config.json:/app/web_config.json:ro
